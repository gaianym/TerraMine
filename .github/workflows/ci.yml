name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Frontend check
        run: npm run check

      # Tauri's build script needs the frontend dist folder to exist.
      - name: Frontend build
        run: npm run build

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features mock-miner -- -D warnings

      - name: cargo test (unit + mock-miner e2e)
        working-directory: src-tauri
        run: cargo test --features mock-miner

[package]
name = "terra-mine"
version = "0.1.0"
description = "TerraMine — LAN ASIC discovery desktop app"
authors = ["TerraMine contributors"]
license = "GPL-3.0"
edition = "2021"
default-run = "terra-mine"
rust-version = "1.87"
repository = "https://github.com/gaianym/TerraMine"

[lib]
name = "terra_mine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
asic-rs = "0.8.6"
asic-rs-core = "0.8.6"
measurements = { version = "0.11", features = ["serde"] }
anyhow = "1"
futures = "0.3"
ipnet = "2"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "rt-multi-thread", "net", "io-util", "signal"] }
tokio-util = { version = "0.7", features = [] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
diqwest = "3"
semver = "1"
md-5 = "0.10"
hex = "0.4"
# SSH fallbacks (plan K2). ring backend: no aws-lc / cmake / NASM on Windows.
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
# Exposes control::mock_miner and the mock-miner binary for manual testing.
mock-miner = []

[[bin]]
name = "mock-miner"
path = "src/bin/mock-miner.rs"
required-features = ["mock-miner"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "rt-multi-thread", "net", "io-util", "test-util"] }
